# ═══════════════════════════════════════════════════════════════════════════
# netlify.toml — gogolftrip.co.uk
#
# This is the COMPLETE file. Replace the whole thing; do not append to it.
#
# NOTE ON EDITING THIS FILE LATER:
#   [[redirects]]  — double brackets. An array. Safe to repeat.
#   [functions."x"] — single brackets. A table. Declaring the same one TWICE
#                     is a hard parse error and Netlify will refuse to build.
# If a deploy suddenly fails with a TOML error, look for a duplicated
# [functions."..."] block first.
# ═══════════════════════════════════════════════════════════════════════════

[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"


# ── FUNCTION TIMEOUTS ──────────────────────────────────────────────────────
# Netlify's default is 10 seconds. Only functions that legitimately need
# longer are listed. Each name must appear exactly once.

# Six parallel OpenAI calls to build the trip panels.
[functions."generate-trip"]
  timeout = 30

# A 500-recipient campaign is five sequential Resend batch calls.
[functions."send-club-campaign"]
  timeout = 26

# Calls Viator, and may try a second endpoint if the first returns nothing.
[functions."get-activities"]
  timeout = 20


# ── SPA ROUTES ─────────────────────────────────────────────────────────────
# index.html pushes real URLs with history.pushState. Netlify knows nothing
# about those paths, so a direct visit, a refresh, or a link you send someone
# returns Netlify's 404 before the app ever loads.
#
# status = 200 is a rewrite, not a redirect: the URL stays as typed and the
# app's own router picks the page from window.location.pathname.
#
# Netlify serves real files before consulting redirects, so none of these can
# shadow anything in /destinations/ or /blog/.
#
# Deliberately explicit rather than a catch-all /* — a catch-all turns every
# typo into the homepage and hides broken internal links.

# Seasonal destinations guide. Matches /destinations EXACTLY; the five
# destination pages are real files at /destinations/*.html and are unaffected.
[[redirects]]
  from = "/destinations"
  to = "/index.html"
  status = 200

# Guest voting link. Without this, every link the "Copy voting link" button
# produces returns Page not found.
[[redirects]]
  from = "/vote"
  to = "/index.html"
  status = 200

# Club portal.
[[redirects]]
  from = "/club-login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/club"
  to = "/index.html"
  status = 200

# Public club pages: /club/<slug>
[[redirects]]
  from = "/club/*"
  to = "/index.html"
  status = 200

# Admin. Needs its own URL so it stays reachable even when the nav link is
# hidden — otherwise a broken is_admin flag locks you out of the one page
# that would tell you the flag is broken.
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200
